name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  build-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build single-file binary
        run: ./packaging/build_binary.sh

      - name: Rename binary for release
        run: mv dist/archbooster dist/archbooster-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: binary-linux-x86_64
          path: dist/archbooster-linux-x86_64

  release:
    needs: [build-wheel, build-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-pypi:
    needs: build-wheel
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      # Requires a PyPI API token stored as the PYPI_API_TOKEN repo secret;
      # skipped automatically until that's configured (see README). The
      # `secrets` context isn't allowed in any `if:` conditional (job or
      # step) -- it has to be routed through `env` first.
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: ${{ env.PYPI_API_TOKEN != '' }}
        with:
          password: ${{ env.PYPI_API_TOKEN }}
